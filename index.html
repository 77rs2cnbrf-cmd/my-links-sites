<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おすすめコンテンツ＆ツールまとめサイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>おすすめコンテンツ＆ツールまとめ</h1>
        <p>最新の良いものをまとめてご紹介</p>
    </header>

    <main class="main-content">
        <!-- おすすめ作品・アイテムセクション -->
        <section class="section">
            <h2>おすすめ作品・アイテム一覧</h2>
            <div class="filter-container">
                <div class="tag-filters" id="tagFilters">
                    <!-- タグフィルターはJavaScriptで生成 -->
                </div>
            </div>
            <div class="cards-container" id="cardsContainer">
                <!-- カードはJavaScriptで生成 -->
            </div>
        </section>

        <!-- 配布ツール・限定コンテンツセクション -->
        <section class="section">
            <h2>配布ツール・限定コンテンツ一覧</h2>
            <div class="tools-container" id="toolsContainer">
                <!-- ツールカードはJavaScriptで生成 -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>※当サイトはアフィリエイト広告（PR）を含みます</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
